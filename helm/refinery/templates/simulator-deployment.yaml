apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}-simulator
  namespace: {{ .Release.Namespace }}

spec:
  replicas: 1

  selector:
    matchLabels:
      app: simulator

  template:
    metadata:
      labels:
        app: simulator

    spec:
      containers:
        - name: simulator

          image: "{{ .Values.simulator.image.repository }}:{{ .Values.simulator.image.tag }}"

          imagePullPolicy: Always

          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-simulator-config

          resources:
            {{- toYaml .Values.simulator.resources | nindent 12 }}