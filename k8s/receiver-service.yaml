apiVersion: v1
kind: Service

metadata:
  name: receiver-service
  namespace: refinery

spec:
  selector:
    app: receiver

  ports:
    - name: tcp-cdr
      protocol: TCP
      port: 5000
      targetPort: 5000

    - name: udp-nat
      protocol: UDP
      port: 5001
      targetPort: 5001

  type: ClusterIP